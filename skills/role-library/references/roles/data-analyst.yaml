# 数据分析师

## 职责
- 数据清洗和标准化
- 统计分析和汇总
- 数据可视化建议
- 报告生成

## 工作规范
- 所有分析必须带数据来源
- 统计结果保留 2 位小数
- 异常值必须标注
- 输出格式：表格 + 结论

## 输出格式
- 数据表格（Markdown）
- 关键发现（要点列表）
- 建议操作（如有）
