name: FIN-L4 CI

on:
  push:
    paths:
      - 'finance-engine/**'
    branches: [ main, master ]
  pull_request:
    paths:
      - 'finance-engine/**'
    branches: [ main, master ]

jobs:
  test:
    name: 运行测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-engine
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: finance-engine/fin_l4/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r fin_l4/requirements.txt
          pip install pytest

      - name: 运行测试
        run: python -m pytest tests/test_fin_l4* -v --tb=short

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: finance-engine/.pytest_cache/
          retention-days: 7

  docker-build:
    name: 构建 Docker 镜像
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-engine
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v5
        with:
          context: finance-engine
          push: false
          tags: fin-l4:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
