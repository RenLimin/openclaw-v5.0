[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-base"
version = "1.0.0"
description = "Enterprise AI Knowledge Base - Agent-independent, portable, multi-format document ingestion + hybrid retrieval with mandatory source references"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Bangcle" }]
keywords = ["knowledge-base", "rag", "graphrag", "search", "llm", "mcp"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "pypdf>=4.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
embedding = ["llama-cpp-python>=0.2.90"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
ai-kb = "cli.main:main"

[tool.setuptools.packages.find]
include = ["ai_kb*", "cli*", "api*", "mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
