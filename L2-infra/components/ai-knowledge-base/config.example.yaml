# AI Knowledge Base - Example Configuration
# Copy to config.yaml and adjust for your environment.

database:
  path: ./data/ai-kb.db

server:
  host: 0.0.0.0
  port: 8000

ingestion:
  min_quality_score: 0.5
  pii_mask_action: mask        # mask | reject | report
  chunker: section             # section | fixed
  chunk_size: 800              # for fixed chunker
  chunk_overlap: 100           # for fixed chunker

embedding:
  provider: local              # local | api
  model: ~/.node-llama-cpp/models/hf_ggml-org_embeddinggemma-300m-qat-Q8_0.gguf
  # api_url: https://your-embedding-api.example.com/v1/embeddings
  # api_key_env: EMBEDDING_API_KEY

retrieval:
  top_k_default: 5
  min_score: 0.3
  use_graph_default: false
  weights:
    entity: 0.4                # entity exact/fuzzy match weight
    fts: 0.3                   # full-text search weight
    vector: 0.3                # vector similarity weight

permissions:
  default_user_attrs: {}       # e.g. {role: admin, dept: engineering}
  enforce: true                # false = bypass permission filtering (dev only)

guardrails:
  input_enabled: true
  retrieval_enabled: true
  output_enabled: true
  circuit_breaker:
    enabled: true
    max_failures: 5
    reset_timeout_seconds: 60

logging:
  level: INFO                  # DEBUG | INFO | WARNING | ERROR
  audit_enabled: true
