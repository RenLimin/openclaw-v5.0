# 供应商配置 — model-scheduling
# 修改此文件 → 热更新(无需重启 Gateway,无需修改 openclaw.json)

providers:
  coding-plan:
    base_url: "https://ark.cn-beijing.volces.com/api/coding/v3"
    api_type: "openai-completions"
    auth_type: "bearer"
    api_key_ref: "coding-plan"
    enabled: true
    health_check:
      endpoint: "/models"
      timeout_ms: 5000
    rate_limit:
      requests_per_minute: 60
      tokens_per_minute: 100000
    notes: "火山方舟 Coding Plan,主力 provider"

  coding-plan-2:
    base_url: "https://ark.cn-beijing.volces.com/api/coding/v3"
    api_type: "openai-completions"
    auth_type: "bearer"
    api_key_ref: "coding-plan-2"
    enabled: true
    health_check:
      endpoint: "/models"
      timeout_ms: 5000
    rate_limit:
      requests_per_minute: 60
      tokens_per_minute: 100000
    notes: "火山方舟 Coding Plan #2 (独立账号),资源余量充足,优先 provider"

  longCat:
    base_url: "https://api.longcat.chat/openai/v1"
    api_type: "openai-completions"
    auth_type: "bearer"
    api_key_ref: "longcat"
    enabled: true
    health_check:
      endpoint: "/models"
      timeout_ms: 5000
    rate_limit:
      requests_per_minute: 30
      tokens_per_minute: 50000
    notes: "Longcat,大 ctx (1M) 兜底 provider"

  deepseek:
    base_url: "https://api.deepseek.com/v1"
    api_type: "openai-completions"
    auth_type: "bearer"
    api_key_ref: "deepseek"
    enabled: false  # 2026-11-25 owner 授权：余额耗尽(HTTP 402)暂停调用，充值后改回 true
    health_check:
      endpoint: "/models"
      timeout_ms: 5000
    rate_limit:
      requests_per_minute: 30
      tokens_per_minute: 50000
    notes: "DeepSeek 官方 API,外部推理兜底；402 余额不足暂停中(2026-11-25)"
