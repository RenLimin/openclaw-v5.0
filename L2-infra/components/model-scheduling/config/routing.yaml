compaction_routing:
  fallback_chain:
  - longCat/LongCat-2.0
  - deepseek/deepseek-reasoner
  - coding-plan/doubao-seed-2-1-turbo
  strategy: same_provider_largest_ctx
compress_rules:
  file_read:
    action: truncate
    max_lines: 500
    suffix: '

      ... [截断: 文件超过 {max_lines} 行,已读取前 {truncate_to} 行]'
    tools:
    - read
    truncate_to: 200
  git_diff:
    action: truncate
    match: git diff
    max_lines: 200
    suffix: '

      ... [截断: 输出超过 {max_lines} 行,已截断为前 {truncate_to} 行]'
    tools:
    - exec
    truncate_to: 100
  grep_output:
    action: truncate
    match: grep|find|ls -la
    max_lines: 100
    suffix: '

      ... [截断: 命令输出超过 {max_lines} 行]'
    tools:
    - exec
    truncate_to: 50
health_thresholds:
  cooldown_seconds: 60
  error_rate_crit: 0.3
  error_rate_warn: 0.1
  latency_crit_ms: 15000
  latency_warn_ms: 5000
task_routing:
  chat:
    description: 日常对话、简单问答、状态查询
    fallback_chain:
    - coding-plan/doubao-seed-2-1-turbo
    - deepseek/deepseek-chat
    - coding-plan/deepseek-v4-flash-ga-260731
    - longCat/LongCat-2.0
    preferred_context: 100000
  coding:
    description: 代码生成、调试、重构、代码审查
    fallback_chain:
    - coding-plan/doubao-seed-2-1-turbo
    - deepseek/deepseek-chat
    - coding-plan/doubao-seed-code-preview-251028
    - coding-plan/deepseek-v4-flash-ga-260731
    - longCat/LongCat-2.0
    preferred_context: 200000
    requires_input_types:
    - text
  embedding:
    description: 记忆检索、语义搜索
    fallback: none
    model: embeddinggemma-300m
    provider: local
  multimodal:
    description: 图片识别、视频分析、OCR、视觉理解
    fallback_chain:
    - coding-plan/doubao-seed-2-1-turbo
    - coding-plan/doubao-seed-2-1-pro-260628
    - coding-plan/doubao-seed-code-preview-251028
    - coding-plan/deepseek-v4-flash-ga-260731
    - longCat/LongCat-2.0
    preferred_context: 200000
    requires_input_types:
    - image
  reasoning:
    description: 复杂推理、架构设计、深度分析
    fallback_chain:
    - deepseek/deepseek-reasoner
    - coding-plan/doubao-seed-2-1-turbo
    - coding-plan/deepseek-v4-flash-ga-260731
    - longCat/LongCat-2.0
    preferred_context: 500000
  research:
    description: 网络搜索、信息收集、文档分析
    fallback_chain:
    - coding-plan/doubao-seed-2-1-turbo
    - coding-plan/deepseek-v4-flash-ga-260731
    - longCat/LongCat-2.0
    - deepseek/deepseek-chat
    preferred_context: 200000
usage_thresholds:
  daily_token_limit: 1000000
  monthly_cost_limit: 50
