{% extends "base.html" %}
{% block title %}账户管理 - FIN-L4{% endblock %}
{% block content %}
<div class="page-header">
    <h1>账户管理</h1>
    <p>管理所有资产/负债账户</p>
</div>

<div class="card">
    <div class="card-title">所有账户</div>
    {% if accounts %}
    <table class="table">
        <thead>
            <tr>
                <th>名称</th>
                <th>类型</th>
                <th class="num">余额</th>
            </tr>
        </thead>
        <tbody>
        {% for acc in accounts %}
            <tr>
                <td>{{ acc.name }}</td>
                <td>{{ acc.type }}</td>
                <td class="num">¥{{ acc.balance }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="text-muted">暂无账户</p>
    {% endif %}
</div>
{% endblock %}
