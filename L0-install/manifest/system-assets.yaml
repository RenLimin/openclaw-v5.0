# L2 基础设施层资产
l2:
  config_management:
    - id: config-safe-write
      name: 配置安全写入通道
      path: L2-infra/components/config-management/config_safe_write.sh
      type: script
      deploy_required: true
      description: dry-run → 写入 → validate → 读回 四步保护流程
    - id: config-snapshots
      name: 配置快照目录
      path: config-snapshots/
      type: directory
      deploy_required: true
      description: 配置变更快照存储

  credentials:
    - id: credentials-script
      name: 凭据管理脚本
      path: L2-infra/components/credentials/credentials.sh
      type: script
      deploy_required: true
      description: 凭据生命周期管理（add/rotate/revoke/audit）

  observability:
    - id: agent-observer
      name: Agent 可观测性脚本
      path: L2-infra/scripts/observability/agent_observer.py
      type: script
      deploy_required: false
      description: 行为观测与日志收集

  memory:
    - id: memory-search-monitor
      name: 记忆检索健康监控
      path: L2-infra/scripts/observability/memory_search_monitor.py
      type: script
      deploy_required: true
      description: 记忆检索三态健康监控（ok/degraded/down）

  knowledge_base:
    - id: kb-index
      name: 知识库工具链
      path: L2-infra/scripts/kb_index.py
      type: script
      deploy_required: true
      description: Markdown 知识库索引/查询/验证/导出工具

  tool_policy:
    - id: tool-policy-audit
      name: 工具策略审计脚本
      path: L2-infra/components/tool-policy/tool_policy_audit.sh
      type: script
      deploy_required: true
      description: 三态模型审计（denied / allowed-but-broken / allowed-and-working）

  model_scheduling:
    - id: model-scheduling
      name: 模型调度系统
      path: model-scheduling/
      type: module
      deploy_required: false
      description: 智能模型路由 + 健康探测 + 用量追踪

  session_lifecycle:
    - id: session-lifecycle
      name: 会话生命周期管理
      path: L2-infra/components/session-lifecycle/
      type: component
      deploy_required: false
      description: 自动清理过期会话（分级策略）

  error_handling:
    - id: error-handling
      name: 错误自动处理
      path: L2-infra/components/error-handling/
      type: component
      deploy_required: false
      description: 检测→分级→自愈闭环

  office_generation:
    - id: office-generation
      name: Office 文档生成组件
      path: L2-infra/components/office-generation/
      type: component
      deploy_required: false
      description: Word/Excel/PPT 文档生成工具链

  ocr_digitalization:
    - id: ocr-digitalization
      name: OCR 文档数字化组件
      path: L2-infra/components/ocr-digitalization/
      type: component
      deploy_required: false
      description: 扫描件/图片 → 高精度文本

