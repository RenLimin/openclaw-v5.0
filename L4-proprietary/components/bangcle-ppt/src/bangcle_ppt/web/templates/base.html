<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ page_title or 'Bangcle PPT' }} | 梆梆安全 PPT 模板生成器{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css?v=1.0">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="菜单">☰</button>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">📊</span> <span>Bangcle PPT</span>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <div class="sidebar-section-title">模板</div>
                    <ul class="sidebar-links">
                        <li><a href="/" class="{% if active_page == 'templates' %}active{% endif %}">
                            <span class="nav-icon">📦</span>模板库
                        </a></li>
                        <li><a href="/generator" class="{% if active_page == 'generator' %}active{% endif %}">
                            <span class="nav-icon">⚡</span>在线生成
                        </a></li>
                    </ul>
                </div>
                <div class="sidebar-section">
                    <div class="sidebar-section-title">主题</div>
                    <div class="theme-switch">
                        <button class="theme-btn" id="themeLight" onclick="setTheme('light')">☀️ 浅色</button>
                        <button class="theme-btn" id="themeDark" onclick="setTheme('dark')">🌙 深色</button>
                    </div>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="footer-text">CPT-012 · v1.0.0</div>
            </div>
        </aside>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // 主题切换
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('ppt-ui-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('theme' + theme.charAt(0).toUpperCase() + theme.slice(1)).classList.add('active');
        }
        (function() {
            const saved = localStorage.getItem('ppt-ui-theme') || 'light';
            setTheme(saved);
        })();

        // 移动端菜单
        (function() {
            const btn = document.getElementById('mobileMenuBtn');
            const sidebar = document.getElementById('sidebar');
            btn.addEventListener('click', () => sidebar.classList.toggle('open'));
            sidebar.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', () => sidebar.classList.remove('open'));
            });
        })();

        // Toast
        window.showToast = function(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            toast.innerHTML = `<span>${icons[type] || 'ℹ️'}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease-out forwards';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        };
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
